<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitarbeiter verwalten</title>
    <style>
        :root {
            --card-bg: rgba(30, 41, 59, 0.55);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container { width: 100%; max-width: 500px; }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-container img {
            max-height: 45px;
            width: auto;
        }

        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .nav a {
            flex: 1;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            color: var(--text-muted);
            border-radius: 8px;
            font-weight: 600;
        }

        .nav a.active { background: var(--primary); color: white; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
            box-sizing: border-box;
        }

        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }

        ul { list-style: none; padding: 0; margin-top: 20px; }

        li {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-del {
            background: var(--danger);
            width: auto;
            padding: 6px 12px;
            margin: 0;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-container">
        <img src="logo.png" alt="BreakzZz Logo">
    </div>

    <div class="nav">
        <a href="index.html">Erfassung</a>
        <a href="mitarbeiter.html" class="active">Mitarbeiter</a>
        <a href="uebersicht.html">📊 Übersicht</a>
    </div>

    <div class="card">
        <h2>👥 Mitarbeiter verwalten</h2>
        
        <form id="addForm">
            <input type="text" id="empName" placeholder="Name des Mitarbeiters..." required>
            <button type="submit">Hinzufügen</button>
        </form>

        <ul id="empList"></ul>
    </div>
</div>

<script>
    const FIREBASE_URL = 'https://zeiterfassung-chef-default-rtdb.europe-west1.firebasedatabase.app/';

    async function loadEmployees() {
        const list = document.getElementById('empList');
        const res = await fetch(FIREBASE_URL + 'employees.json');
        const data = await res.json();
        
        list.innerHTML = '';
        if (data) {
            Object.keys(data).forEach(id => {
                let li = document.createElement('li');
                li.innerHTML = `
                    <span>${data[id].name}</span>
                    <button class="btn-del" onclick="deleteEmp('${id}')">Löschen</button>
                `;
                list.appendChild(li);
            });
        }
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('empName').value.trim();
        if (!name) return;

        await fetch(FIREBASE_URL + 'employees.json', {
            method: 'POST',
            body: JSON.stringify({ name: name })
        });
        document.getElementById('empName').value = '';
        loadEmployees();
    });

    async function deleteEmp(id) {
        if (confirm('Mitarbeiter wirklich löschen?')) {
            await fetch(FIREBASE_URL + `employees/${id}.json`, { method: 'DELETE' });
            loadEmployees();
        }
    }

    loadEmployees();
</script>
</body>
</html>
