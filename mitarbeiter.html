<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitarbeiterverwaltung</title>
    <style>
        :root {
            --card-bg: rgba(30, 41, 59, 0.55);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.7)), url('background.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 650px; }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        .logo-container img {
            max-height: 45px;
            width: auto;
        }

        .nav {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .nav a {
            flex: 1;
            text-align: center;
            padding: 10px;
            text-decoration: none;
            color: var(--text-muted);
            border-radius: 8px;
            font-weight: 600;
            transition: 0.2s;
        }

        .nav a.active, .nav a:hover { background: var(--primary); color: white; }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .user-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 13px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
        }
        .badge-kuche { background: rgba(245, 158, 11, 0.25); color: var(--warning); border: 1px solid var(--warning); }
        .badge-service { background: rgba(59, 130, 246, 0.25); color: var(--primary); border: 1px solid var(--primary); }
        .badge-admin { background: rgba(16, 185, 129, 0.25); color: var(--success); border: 1px solid var(--success); }

        label {
            display: block;
            margin-top: 12px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
            box-sizing: border-box;
            font-size: 15px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 14px;
            transition: 0.2s;
        }

        button:hover { background: var(--primary-hover); }

        .emp-list {
            list-style: none;
            padding: 0;
            margin-top: 10px;
        }

        .emp-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid var(--border);
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .emp-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-del {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid var(--danger);
            width: auto;
            padding: 6px 12px;
            margin: 0;
            font-size: 13px;
        }

        .btn-del:hover {
            background: var(--danger);
            color: white;
        }

        .modal {
            display: flex;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .modal-content {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

<!-- PIN LOGIN MODAL -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: #f8fafc;">🔐 PIN-Eingabe erforderlich</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Bitte gib deine PIN ein, um fortzufahren:</p>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="password" id="pinInput" placeholder="PIN eingeben..." maxlength="6" autofocus required style="text-align: center; font-size: 18px; letter-spacing: 4px;">
            <button type="submit" id="btnLoginSubmit" style="margin-top: 15px;">Einloggen</button>
        </form>
        <div id="loginError" style="color: var(--danger); font-size: 13px; margin-top: 10px; display: none;">Falsche PIN!</div>
    </div>
</div>

<div class="container">
    <div class="logo-container">
        <img src="logo.png" alt="BreakzZz Logo">
    </div>

    <div class="nav">
        <a href="index.html">Erfassung</a>
        <a href="mitarbeiter.html" class="active">Mitarbeiter</a>
        <a href="uebersicht.html">📊 Übersicht</a>
    </div>

    <div class="card">
        <div class="user-info-bar">
            <span id="userStatusText">Angemeldet</span>
            <button onclick="logout()" style="width: auto; padding: 4px 10px; margin: 0; font-size: 12px; background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid var(--danger);">Abmelden</button>
        </div>

        <h2>👥 Neuen Mitarbeiter anlegen</h2>
        <form id="addEmployeeForm">
            <label for="empName">Name des Mitarbeiters:</label>
            <input type="text" id="empName" placeholder="Vor- und Nachname..." required>

            <label for="empDept">Bereich / Abteilung:</label>
            <select id="empDept" required>
                <option value="Küche">Küche</option>
                <option value="Service">Service</option>
            </select>

            <button type="submit">Mitarbeiter hinzufügen</button>
        </form>
    </div>

    <div class="card">
        <h3>📋 Aktuelle Mitarbeiterliste</h3>
        <ul id="employeeList" class="emp-list">
            <li>Lade Mitarbeiter...</li>
        </ul>
    </div>
</div>

<script>
    const WORKER_URL = 'https://throbbing-sea-5e5b.breakzzzhd.workers.dev/';

    function checkAuth() {
        const session = sessionStorage.getItem('breakzzz_auth');
        if (session) {
            const authData = JSON.parse(session);
            document.getElementById('loginModal').style.display = 'none';
            setupUI(authData);
            loadEmployees();
        } else {
            document.getElementById('loginModal').style.display = 'flex';
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const pin = document.getElementById('pinInput').value.trim();
        const errorDiv = document.getElementById('loginError');
        const btnSubmit = document.getElementById('btnLoginSubmit');

        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Prüfe...';

        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pin: pin,
                    path: 'auth',
                    action: 'login'
                })
            });

            if (res.ok) {
                const authResult = await res.json();
                const authData = {
                    department: authResult.department,
                    roleName: authResult.roleName,
                    pin: pin
                };
                sessionStorage.setItem('breakzzz_auth', JSON.stringify(authData));
                document.getElementById('loginModal').style.display = 'none';
                document.getElementById('pinInput').value = '';
                errorDiv.style.display = 'none';
                setupUI(authData);
                loadEmployees();
            } else {
                errorDiv.style.display = 'block';
            }
        } catch (err) {
            console.error('Login-Fehler:', err);
            errorDiv.style.display = 'block';
        } finally {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Einloggen';
        }
    }

    function logout() {
        sessionStorage.removeItem('breakzzz_auth');
        location.reload();
    }

    function setupUI(authData) {
        const statusText = document.getElementById('userStatusText');
        const deptSelect = document.getElementById('empDept');

        if (authData.department === 'ALL') {
            statusText.innerHTML = `Eingeloggt als: <span class="badge badge-admin">${authData.roleName}</span>`;
        } else if (authData.department === 'Küche') {
            statusText.innerHTML = `Eingeloggt als: <span class="badge badge-kuche">${authData.roleName}</span>`;
            deptSelect.value = 'Küche';
            deptSelect.disabled = true;
        } else if (authData.department === 'Service') {
            statusText.innerHTML = `Eingeloggt als: <span class="badge badge-service">${authData.roleName}</span>`;
            deptSelect.value = 'Service';
            deptSelect.disabled = true;
        }
    }

    async function apiRequest(path, action, data = null) {
        const session = JSON.parse(sessionStorage.getItem('breakzzz_auth') || '{}');
        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pin: session.pin,
                    path: path,
                    action: action,
                    data: data
                })
            });
            if (res.status === 401) {
                logout();
                return null;
            }
            if (!res.ok) throw new Error('Netzwerk- oder Berechtigungsfehler');
            return await res.json();
        } catch (e) {
            console.error('API Fehler:', e);
            return null;
        }
    }

    async function loadEmployees() {
        const session = JSON.parse(sessionStorage.getItem('breakzzz_auth') || '{}');
        const list = document.getElementById('employeeList');
        const data = await apiRequest('employees', 'get');

        list.innerHTML = '';

        if (!data || Object.keys(data).length === 0) {
            list.innerHTML = '<li style="color: var(--text-muted);">Keine Mitarbeiter vorhanden.</li>';
            return;
        }

        let count = 0;
        Object.keys(data).forEach(id => {
            const emp = data[id];
            const empDept = emp.department || 'Küche';

            if (session.department !== 'ALL' && session.department !== empDept) {
                return;
            }

            count++;
            const badgeClass = empDept === 'Küche' ? 'badge-kuche' : 'badge-service';
            const li = document.createElement('li');
            li.className = 'emp-item';
            li.innerHTML = `
                <div class="emp-info">
                    <strong>${emp.name}</strong>
                    <span class="badge ${badgeClass}">${empDept}</span>
                </div>
                <button class="btn-del" onclick="deleteEmployee('${id}', '${emp.name}')">Löschen</button>
            `;
            list.appendChild(li);
        });

        if (count === 0) {
            list.innerHTML = '<li style="color: var(--text-muted);">Keine Mitarbeiter in deinem Bereich gefunden.</li>';
        }
    }

    document.getElementById('addEmployeeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nameInput = document.getElementById('empName');
        const deptSelect = document.getElementById('empDept');

        const name = nameInput.value.trim();
        const department = deptSelect.value;

        if (!name) return;

        const id = 'emp_' + Date.now();
        await apiRequest(`employees/${id}`, 'put', {
            id: id,
            name: name,
            department: department
        });

        nameInput.value = '';
        loadEmployees();
    });

    async function deleteEmployee(id, name) {
        if (confirm(`Mitarbeiter "${name}" wirklich löschen?`)) {
            await apiRequest(`employees/${id}`, 'delete');
            loadEmployees();
        }
    }

    checkAuth();
</script>
</body>
</html>
